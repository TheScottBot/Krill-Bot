name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Repository policy checks
        run: python repository_checks.py
      - name: Generated site pages
        run: python site_builder.py --check
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: MyPy strict analysis
        run: mypy krillbot repository_checks.py site_builder.py
      - name: Pytest
        run: pytest
      - name: Parser fuzz properties
        run: pytest tests/test_result_grammar.py

      - name: Python development mode analysis
        run: python -X dev -m pytest -W error
